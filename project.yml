name: LocalTunes
options:
  bundleIdPrefix: com.personal
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: targeted
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "2"
    CODE_SIGNING_ALLOWED: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  LocalTunes:
    type: application
    platform: iOS
    sources: [LocalTunes]
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    settings:
      base:
        INFOPLIST_FILE: Config/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - sdk: libsqlite3.tbd
  LocalTunesTests:
    type: bundle.unit-test
    platform: iOS
    sources: [LocalTunesTests]
    dependencies:
      - target: LocalTunes
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.localtunes.tests
        GENERATE_INFOPLIST_FILE: YES
  LocalTunesUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [LocalTunesUITests]
    dependencies:
      - target: LocalTunes
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.localtunes.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  LocalTunes:
    build:
      targets:
        LocalTunes: all
        LocalTunesTests: [test]
        LocalTunesUITests: [test]
    test:
      targets: [LocalTunesTests, LocalTunesUITests]
      gatherCoverageData: true
