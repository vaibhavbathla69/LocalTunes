name: Build iPhone IPA
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate and resolve
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodegen generate
          xcodebuild -resolvePackageDependencies -project LocalTunes.xcodeproj -scheme LocalTunes
      - name: Test FLAC playback
        run: |
          set -euo pipefail
          DEVICE_ID=$(python3 scripts/simulator.py)
          xcodebuild test -project LocalTunes.xcodeproj -scheme LocalTunes \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -only-testing:LocalTunesTests/FLACPlaybackTests \
            -derivedDataPath build/TestData -resultBundlePath build/FLACTests.xcresult \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee flac-test.log
      - name: Test library and interface
        run: |
          set -euo pipefail
          DEVICE_ID=$(python3 scripts/simulator.py)
          xcodebuild test -project LocalTunes.xcodeproj -scheme LocalTunes \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -skip-testing:LocalTunesTests/FLACPlaybackTests \
            -derivedDataPath build/TestData -resultBundlePath build/Tests.xcresult \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee test.log
      - name: Compile for physical iPhone without signing
        run: |
          set -euo pipefail
          xcodebuild build -project LocalTunes.xcodeproj -scheme LocalTunes \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath build/DeviceData CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' 2>&1 | tee build.log
      - name: Export UI screenshots
        if: always()
        run: |
          if [ -d build/Tests.xcresult ]; then
            xcrun xcresulttool export attachments --path build/Tests.xcresult --output-path build/Screenshots
          fi
      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          mkdir -p dist/Payload
          ditto build/DeviceData/Build/Products/Release-iphoneos/LocalTunes.app dist/Payload/LocalTunes.app
          test -f dist/Payload/LocalTunes.app/Info.plist
          test -x dist/Payload/LocalTunes.app/LocalTunes
          cd dist
          /usr/bin/zip -qry LocalTunes-unsigned.ipa Payload
          unzip -t LocalTunes-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: LocalTunes-unsigned-IPA
          path: dist/LocalTunes-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
      - name: Publish diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: |
            build.log
            test.log
            flac-test.log
            build/FLACTests.xcresult
            build/Tests.xcresult
            build/Screenshots
          if-no-files-found: ignore
      - name: Summarize
        if: always()
        run: |
          echo 'Unsigned IPA requires signing with Sideloadly before installation.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Inspect failed steps and build-diagnostics for compiler or test failures.' >> "$GITHUB_STEP_SUMMARY"
